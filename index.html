<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UPPLIN" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* Boot fallback — conteúdo visível antes do React montar.
         Garante que NUNCA haja "tela em branco" no review da Apple,
         mesmo em iPads/iPhones lentos ou com JS atrasado. */
      html, body { margin: 0; padding: 0; background: #000; color: #fff; }
      #root:empty::before {
        content: "UPPLIN";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #FF6A00 0%, #FF2D2D 50%, #FF007A 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: upplin-pulse 1.4s ease-in-out infinite;
      }
      @keyframes upplin-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
    </style>
    <meta name="google-site-verification" content="rIidYVuI7fT1r0osQvyI3vKy3Q2KKokwdcjPId02lFw" />
    <title data-rh="true">UPPLIN | Eventos, shows e ingressos perto de você</title>
    <meta data-rh="true" name="description" content="Descubra shows, festas, teatro, workshops e experiências na UPPLIN. Explore eventos perto de você e encontre ingressos e organizadores." />
    <meta data-rh="true" name="robots" content="noindex,follow" />
    <meta name="author" content="UPPLIN" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/upplin-icon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
