<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UPPLIN" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* Boot fallback — conteúdo visível antes do React montar.
         Garante que NUNCA haja "tela em branco" no review da Apple,
         mesmo em iPads/iPhones lentos ou com JS atrasado. */
      html, body { margin: 0; padding: 0; background: #000; color: #fff; }
      #root:empty::before {
        content: "UPPLIN";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #FF6A00 0%, #FF2D2D 50%, #FF007A 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: upplin-pulse 1.4s ease-in-out infinite;
      }
      @keyframes upplin-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
    </style>
    <meta name="google-site-verification" content="rIidYVuI7fT1r0osQvyI3vKy3Q2KKokwdcjPId02lFw" />
    <title>UPPLIN — Descubra e Compre Ingressos para os Melhores Eventos</title>
    <meta name="description" content="Plataforma social para descobrir, conectar e comprar ingressos dos melhores shows, festas, conferências e experiências do Brasil." />
    <meta name="author" content="UPPLIN" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UPPLIN" />
    <meta property="og:title" content="UPPLIN — Descubra os melhores eventos do Brasil" />
    <meta property="og:description" content="Shows, festas, conferências e experiências únicas. Compre ingressos e conecte-se com a galera." />
    <meta property="og:url" content="https://upplin.com/" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@upplin" />
    <meta name="twitter:title" content="UPPLIN — Descubra os melhores eventos do Brasil" />
    <meta name="twitter:description" content="Shows, festas, conferências e experiências únicas. Compre ingressos e conecte-se com a galera." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://storage.googleapis.com/gpt-engineer-file-uploads/3GyNfSv1cIVY8dtP0xJm7MYReow1/uploads/1769815890468-Captura de tela 2026-01-29 223802.png" />

    <!-- JSON-LD: sitewide identity -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UPPLIN",
        "url": "https://upplin.com/",
        "description": "Plataforma social para descobrir, conectar e comprar ingressos dos melhores eventos do Brasil.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://upplin.com/eventos?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "UPPLIN",
        "url": "https://upplin.com/",
        "email": "contato@upplin.com",
        "telephone": "+55-85-2010-3399",
        "areaServed": "BR"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
